name: Build Diamond Elantra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get Java runtimes from the official PojavLauncher release APK
        id: jre
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/PojavLauncherTeam/PojavLauncher/releases?per_page=40" > releases.json
          # First release APK big enough to contain the bundled runtimes.
          jq -r '.[] | .tag_name as $t | .assets[] | select(.name|endswith(".apk")) | select(.size > 80000000)
                 | [$t, .name, .size, .browser_download_url] | @tsv' releases.json | head -20
          URL=$(jq -r '[.[] | .assets[] | select(.name|endswith(".apk")) | select(.size > 80000000)][0].browser_download_url' releases.json)
          echo "Using: $URL"
          test -n "$URL" -a "$URL" != "null"
          curl -fsSL -o pojav-official.apk "$URL"
          mkdir -p apkx
          unzip -q pojav-official.apk 'assets/components/jre/*' 'assets/components/jre-new/*' 'assets/components/jre-21/*' -d apkx || true
          D=app_pojavlauncher/src/main/assets/components
          for n in jre jre-new jre-21; do
            if [ -d "apkx/assets/components/$n" ]; then mv "apkx/assets/components/$n" "$D/$n"; echo "got $n"; else echo "MISSING $n"; fi
          done
          test -d "$D/jre" -a -d "$D/jre-new"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build demo.jar (Forge 1.20.1 demo-mode mod)
        continue-on-error: true
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip -O /tmp/gradle88.zip
          unzip -q /tmp/gradle88.zip -d /tmp
          cd demo-mod
          /tmp/gradle-8.8/bin/gradle build --no-daemon
          ls -la build/libs
          mkdir -p ../app_pojavlauncher/src/main/assets/components/demo
          cp build/libs/demo.jar ../app_pojavlauncher/src/main/assets/components/demo/demo.jar

      - name: Build APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          if [ "${{ steps.jre.outcome }}" = "success" ]; then NAME=DiamondElantra.apk; else NAME=DiamondElantra-noruntime.apk; fi
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "out/$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiamondElantra-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Diamond Elantra build ${{ github.run_number }}
          files: |
            out/*.apk
            demo-mod/build/libs/demo.jar
          fail_on_unmatched_files: false
